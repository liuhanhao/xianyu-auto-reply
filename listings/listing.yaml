# ============================================================
# 闲鱼商品发布配置 —— 填好这个文件，跟 CodeBuddy 说「发布它」
# ============================================================
# 一次配置 = 一个商品 = 一个账号。
# 发多个商品就复制多份（如 listing-耳机.yaml），逐份发布。
#
# 填写完执行：
#   python3 .codebuddy/skills/xianyu-publish/scripts/publish.py listings/listing.yaml --dry-run
#
# 带 # 的行是说明，可以删。冒号后面为空的字段都需要你填。

# ===== 1. 分销秘钥 =====
# 在哪拿：客户端 → 个人设置 → 「分销秘钥」那一栏，点复制。
#   打开个人设置页面时它会自动生成（32 位随机字符串），没有就点「更换」生成一个。
# 是什么：等同于账号密码，只用来确认「你是哪个用户」，不涉及分销/返佣业务。
#   不要提交到 git。点过「更换」后旧值失效，这里要同步更新。
secret_key: ""

# ===== 2. 发到哪个账号 =====
# 闲鱼账号 ID。不知道就留空跑一次，脚本会把你的账号列出来让你选。
# 该账号必须已在客户端登录（有 Cookie），否则会报「账号缺少Cookie」。
account_id: ""

# ===== 3. 商品信息 =====
title: ""            # 标题，≤200 字。可让我帮你写
description: ""      # 描述，≤1500 字。分类推荐依据这段文本，写清品类/品牌/成色
price: 0             # 售价，必须 > 0。发布前核对，填错只能下架重发
original_price:      # 选填，原价（划线价）。不填就把这行删掉
address: ""          # 宝贝所在地，如「浙江 杭州」「广东 深圳」。必填
quantity: 1          # 库存，1~999999

# ===== 4. 商品图片 =====
# 本地路径，至少 1 张、最多 9 张。绝对路径，或相对本文件所在目录（listings/）。
# 需要配图就说一声，我生成后你把路径填这里。
# 卖二手实物建议实拍：闲鱼对图文一致性有要求，AI 图有被判虚假描述的风险。
images:
  - ""

# ===== 5. 运费 =====
# free=包邮  fixed=固定运费  distance=按距离  template=运费模板  none=无需邮寄
shipping_method: free
postage: 0           # 仅 shipping_method=fixed 时生效

# ===== 6. 分类 =====
# 留空由脚本用描述向闲鱼请求分类推荐，默认取第 1 个。
# 预览时会列出全部候选，不准就把想用的序号填这里（从 0 开始）再跑。
category_index: 0
