# 闲鱼商品发布配置
# 复制本文件到工作区（如 listings/我的商品.yaml），填写后执行 skill 发布。
# 除标注「选填」的字段外均为必填。

# ===== 身份凭证 =====
# 分销秘钥：客户端「个人设置」页的「分销秘钥」一栏复制。第一次填好后本文件可反复复用。
# 注意：它只用于确认「你是哪个用户」，不涉及分销/返佣业务。
secret_key: ""

# 闲鱼账号 ID。留空时脚本会列出可选账号后退出。
# 不知道填什么就先留空跑一次，脚本会把账号列出来。
account_id: ""

# ===== 商品信息 =====
title: ""            # 标题，≤200 字
description: ""      # 描述，≤1500 字。分类推荐依据这段文本，写清楚品类/品牌/成色
price: 0             # 售价，必须 > 0
original_price:      # 选填，原价（划线价），不填就删掉这一行
address: ""          # 宝贝所在地，如「浙江 杭州」「广东 深圳」
quantity: 1          # 库存数量，1~999999

# ===== 商品图片 =====
# 本地路径，至少 1 张、最多 9 张。绝对路径，或相对本配置文件所在目录。
# 需要 AI 生成图片时，先让 CodeBuddy 生成并确认路径，再填到这里。
images:
  - ""

# ===== 运费 =====
# free=包邮  fixed=固定运费  distance=按距离  template=运费模板  none=无需邮寄
shipping_method: free
postage: 0           # 仅 shipping_method=fixed 时生效

# ===== 分类 =====
# 留空由脚本用描述向闲鱼请求分类推荐，默认取推荐结果第 1 个。
# 若推荐不准，跑一次看输出里的候选清单，把想用的序号填到这里（从 0 开始）后重跑。
category_index: 0
